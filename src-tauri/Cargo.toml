[package]
name = "papyrus"
version = "0.1.0"
description = "A quiet local-first Markdown notebook"
authors = ["Papyrus"]
edition = "2021"

[lib]
name = "papyrus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.40", features = ["serde"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
keyring-core = "1.0.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tauri = { version = "2.4.1", features = [] }
tauri-plugin-dialog = "2.2.0"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.1"
zip = { version = "2.2.3", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.1.4"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
tauri-plugin-barcode-scanner = "2.4.5"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["protected"] }
tauri-plugin-barcode-scanner = "2.4.5"

[dev-dependencies]
tempfile = "3.16.0"
